{% extends 'base.html' %}
{% load static %}

{% block title %}Register – Student Guidance System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">
                    <i class="fas fa-user-plus text-success"></i> Register
                </h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 py-2 mt-3">
                        <i class="fas fa-user-check"></i> Register
                    </button>
                </form>
                <p class="text-center mt-3">
                    Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
