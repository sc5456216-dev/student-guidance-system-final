{% extends 'base.html' %}
{% load static %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<p>Edit your profile and preferences here.</p>
<form>
    <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" value="{{ user.email }}">
    </div>
    <div class="mb-3">
        <label>Phone</label>
        <input type="text" class="form-control" value="{{ user.phone|default:'' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
<a href="{% url 'dashboard_page' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>
{% endblock %}
