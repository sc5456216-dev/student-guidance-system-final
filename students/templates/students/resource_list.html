{% extends 'base.html' %}
{% load static %}
{% block title %}Resources{% endblock %}
{% block content %}
<h1>Resources</h1>
<ul>
    {% for resource in resources %}
        <li>{{ resource.name }} – <a href="{{ resource.file.url }}">Download</a></li>
    {% empty %}
        <li>No resources available.</li>
    {% endfor %}
</ul>
<a href="{% url 'dashboard_page' %}" class="btn btn-secondary">Back to Dashboard</a>
{% endblock %}
